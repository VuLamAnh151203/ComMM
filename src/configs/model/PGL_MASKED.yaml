embedding_size: 64
feat_embed_dim: 64

learning_rate_scheduler: [0.96, 50]
learning_rate: 0.001

n_mm_layers: 1
n_ui_layers: 2
knn_k: 10
mm_image_weight: 0.1

# Two-branch masked user-item graph learning.
cl_weight: 0.1
cl_temperature: 0.2
# auto: branch CL for dual, dropout CL for masked_only (legacy behavior);
# branch: CL between full/masked pre-fusion U-I representations;
# dropout: original PGL CL on two dropout views of the selected target;
# branch_and_dropout: mean of branch CL and dropout CL;
# masked_to_full_teacher: one-way masked -> stopgrad(full);
# bidirectional_full_teacher: two-way InfoNCE, full is stopgrad;
# Append _and_dropout to either teacher mode to add dropout CL.
cl_mode: bidirectional_full_teacher_and_dropout
# fused: dropout CL on fused output; full: dropout CL on full U-I branch.
cl_dropout_target: fused
dropout: 0.2
mask_weight: 0.1
# mask_weight: 0.0

mask_keep_ratio: 0.3
mask_binary_weight: 0.1
# full: use D_full for faster edge gating; masked: recompute D_mask.
mask_degree_mode: full
# soft: weighted full graph; hard: retain mask_keep_ratio edges;
# double_full: no mask, both branches use the complete U-I graph;
# svd: one full branch and one original-PGL global SVD branch;
# local_prunning: full + locally pruned during training; full + full at inference.
# random_fixed: one uniformly sampled mask, fixed for training and inference;
# random_dynamic: resample uniformly each epoch, fixed seeded mask for inference.
# Set cl_weight: 0.0 when the ablation must exclude the CL objective itself.
mask_graph_mode: hard
# Seed for fixed/evaluation random masks. Dynamic training follows the run RNG.
random_mask_seed: 999
# shared: both branches share user tables; separate: one table pair per branch.
user_embedding_mode: separate
# dual: full + masked branch; masked_only: only the masked branch.
ui_branch_mode: dual
# gated_sum: g*H_full + (1-g)*H_masked;
# gated_concat: Linear([g*H_full || (1-g)*H_masked]) back to 128D.
ui_fusion_mode: gated_sum
# Controls stochastic Gumbel top-k exploration during training.
hard_mask_temperature: 1.0

# Save the best-validation masks, embedding tables, and branch outputs.
save_analysis_artifacts: True
# Leave the in-memory model at the best validation epoch after training.
restore_best_model: True

hyper_parameters: []
