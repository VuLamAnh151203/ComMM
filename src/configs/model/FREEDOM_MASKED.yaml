embedding_size: 64
feat_embed_dim: 64

learning_rate_scheduler: [0.96, 50]
learning_rate: 0.001
reg_weight: 0.001
cl_weight: 0.0
cl_temperature: 0.2
# none: only BPR on the fused output; branches: additionally supervise each
# complete original/masked FREEDOM branch after its parallel I-I residual.
aux_bpr_mode: none
aux_bpr_weight: 0.1

n_mm_layers: 1
n_ui_layers: 2
knn_k: 10
mm_image_weight: 0.1

# Applied only to FREEDOM's degree-sensitive user-item branch.
dropout: 0.8

# Learned/static graph used by the independent masked branch.
# Also supports random_fixed and random_dynamic non-learnable masks.
# Set dropout: 0.0 for a strict Full + Random Mask experiment.
mask_graph_mode: hard
mask_keep_ratio: 0.3
random_mask_seed: 999
# full: retain normalization from the full graph; masked: recompute degrees.
mask_degree_mode: full
mask_weight: 0.1
mask_binary_weight: 0.1
hard_mask_temperature: 1.0

# none: disabled; masked_gcn: order each user's train-history edge mask by
# cosine relevance to the mean masked U-I GCN item representation.
# The ordering target is detached and the pairwise loss optimizes mask logits.
mask_relation_mode: none
mask_relation_weight: 0.05
mask_relation_temperature: 1.0
mask_relation_pairs_per_user: 32
mask_relation_min_history: 2
mask_relation_min_relevance_gap: 0.05
mask_relation_user_ratio: 1.0
# 0 means no cap among the unique users in the current training batch.
mask_relation_max_users: 0
# Linearly scale the relation loss during its first N epochs; 0 disables it.
mask_relation_warmup_epochs: 10
mask_relation_seed: 20000

# Each branch has independent user/item ID tables by default.
user_embedding_mode: separate
item_embedding_mode: separate
# id: original FREEDOM item-ID input;
# multimodal: concatenate modalities then project 2d -> d;
# multimodal_concat: keep [image d | text d] at 2d in U-I and I-I;
# hybrid: LayerNorm(item-ID + learned_weight * multimodal), also shared.
# All multimodal modes require item_embedding_mode: shared;
# multimodal_concat additionally requires both image and text features.
item_input_mode: id
hybrid_mm_weight: 0.5
# dual: FREEDOM + mask; masked_only: mask branch only.
ui_branch_mode: dual
# gated_sum: learned weighted sum; gated_concat: gated 2x input projected
# back to branch dimension; gloria_concat: direct [original | masked], no
# gate/projection, output 2x; each branch keeps its parallel FREEDOM I-I path.
ui_fusion_mode: gated_sum
# shared: one gate network for both node types; separate: user/item gates.
ui_gate_mode: separate
# xavier: current data-dependent random initialization around 0.5;
# constant: start every gate at gate_initial_original_weight, then learn.
gate_init_mode: xavier
gate_initial_original_weight: 0.9
# reuse_ui_item: reuse the U-I item gate for I-I weighted fusion;
# separate: learn an independent multimodal gate.
mm_gate_mode: reuse_ui_item

save_analysis_artifacts: True
restore_best_model: True

hyper_parameters: []
